name: Build and Push XFCE Tools Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * *"

jobs:
  build-xfce-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            nillivanilli0815/wolf-xfce-tools
          tags: |
            type=raw,value=edge
            type=sha,format=short

      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: ./xfce-tooling-bootstrap
          file: ./xfce-tooling-bootstrap/Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: wolf-xfce-tools:smoke-test

      - name: Smoke test container stays running
        run: |
          docker run --rm -d --name test-xfce wolf-xfce-tools:smoke-test
          sleep 10
          if ! docker ps --format '{{.Names}}' | grep -q '^test-xfce$'; then
            docker logs test-xfce || true
            docker rm -f test-xfce || true
            exit 1
          fi
          docker rm -f test-xfce

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./xfce-tooling-bootstrap
          file: ./xfce-tooling-bootstrap/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
